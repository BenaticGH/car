<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack Offline</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Loading libraries locally -->
    <script src="three.min.js"></script>
    <script src="cannon.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div id="timer">00:00.000</div>
        <div id="speedometer">0 km/h</div>
        
        <!-- NEW: On-screen back button while driving -->
        <button id="back-btn" class="secondary hidden" onclick="returnToMenu()" style="position: absolute; top: 20px; left: 20px; font-size: 16px; padding: 10px 20px; z-index: 10;">Esc - Main Menu</button>
        
        <div id="menu" class="screen">
            <h1>POLYRACING</h1>
            <p style="text-align: center; line-height: 1.6;">
                Controls: WASD / Arrows to Drive<br>
                <b>R or Enter</b> to Quick Restart | <b>Escape</b> for Main Menu
            </p>
            
            <div class="level-select" style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px;">
                <button onclick="startGame(1)">Level 1 - The Straightaway</button>
                <button onclick="startGame(2)">Level 2 - The Ramps</button>
                <button onclick="startGame(3)">Level 3 - The Curves</button>
                <button onclick="startGame(4)">Level 4 - High Jump</button>
                <button onclick="startGame(5)">Level 5 - The Zig Zag</button>
            </div>
        </div>

        <div id="end-screen" class="screen hidden">
            <h2>FINISH!</h2>
            <p>Your Time: <span id="final-time"></span></p>
            
            <input type="text" id="player-name" placeholder="Enter your name" maxlength="10">
            <button onclick="submitScore()">Save Local Best</button>
            
            <div class="leaderboard-container">
                <h3>Your Local Best Times</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="startGame(currentLevel)" class="secondary">Play Again</button>
                <button onclick="returnToMenu()" class="secondary" style="background:#576574;">Main Menu</button>
            </div>
        </div>
    </div>

    <!-- Loads our game script -->
    <script src="game.js"></script>
</body>
</html>
